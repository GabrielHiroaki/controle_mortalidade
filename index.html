<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Mortalidade Semanal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef3f8;
    padding:25px;
    color:#333;
}

.container{
    max-width:1700px;
    margin:auto;
}

.card{
    background:#f8fafc;
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.titulo{
    font-size:32px;
    font-weight:bold;
    text-align:center;
    color:#1e3a8a;
    margin-bottom:20px;
}

.top-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:18px;
}

.top-grid > div{
    display:flex;
    flex-direction:column;
}

.info{
    font-size:13px;
    font-weight:700;
    color:#555;
    margin-bottom:6px;
    letter-spacing:.4px;
}

input,
select{
    width:100%;
    height:44px;
    padding:0 12px;
    border:1px solid #d8dde5;
    border-radius:10px;
    font-size:15px;
    transition:.2s;
    background:#fff;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

input[readonly]{
    background:#f3f6fb;
    font-weight:bold;
    color:#1d4ed8;
}

button{
    border:none;
    border-radius:10px;
    padding:11px 18px;
    margin:4px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    transition:.2s;
    color:#fff;
}

button:hover{
    transform:translateY(-2px);
}

button:nth-of-type(1){
    background:#16a34a;
}

button:nth-of-type(2){
    background:#2563eb;
}

button:nth-of-type(3){
    background:#dc2626;
}

.btn-exportar{
    background:#7c3aed;
}

.btn-importar{
    background:#f59e0b;
}

.btn-detalhamento{
    background:#0891b2;
    width:100%;
    height:44px;
    align-self:flex-end;
}

.modal-overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(15,23,42,.55);
    z-index:9998;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    background:#fff;
    border-radius:16px;
    padding:26px;
    max-width:900px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.modal-box h2{
    color:#1e3a8a;
    margin-bottom:4px;
    font-size:20px;
}

.modal-box .subtitulo{
    color:#555;
    font-size:14px;
    margin-bottom:18px;
}

.form-ovos{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:flex-end;
    background:#f1f5f9;
    padding:16px;
    border-radius:12px;
    margin-bottom:20px;
}

.form-ovos > div{
    display:flex;
    flex-direction:column;
    min-width:150px;
}

.form-ovos label{
    font-size:12px;
    font-weight:700;
    color:#555;
    margin-bottom:4px;
}

.efetivo-box{
    background:#dcfce7;
    color:#166534;
    font-weight:bold;
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
}

.tabela-ovos{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-size:13px;
}

.tabela-ovos th{
    background:#1e40af;
    color:#fff;
    padding:8px;
}

.tabela-ovos td{
    border:1px solid #e2e8f0;
    padding:8px;
    text-align:center;
}

.tabela-ovos tr:nth-child(even){
    background:#f8fafc;
}

.status-ok{
    color:#166534;
    font-weight:bold;
}

.status-baixo{
    color:#b91c1c;
    font-weight:bold;
}

.grafico-container{
    margin-top:20px;
    background:#f8fafc;
    border-radius:12px;
    padding:16px;
}

.btn-fechar-modal{
    background:#475569;
    margin-top:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:12px;
    background:#fff;
    border:1px solid #cbd5e1;
}

thead th{
    background:#1e40af;
    color:#fff;
    padding:12px;
    font-size:14px;
    position:sticky;
    top:0;
}

tbody td{
    border:1px solid #e2e8f0;
    padding:8px;
    text-align:center;
}

tbody tr:nth-child(even){
    background:#f1f5f9;
}

tbody tr:nth-child(odd){
    background:#ffffff;
}

tbody tr:hover td{
    background:#dbeafe !important;
}

.mortalidade{
    width:65px;
    height:34px;
    background:#f8fafc;
    border:1px solid #cbd5e1;
    font-weight:bold;
    color:#1e293b;
}
.semanaTotal{
    background:#e5e7eb !important;
    font-weight:bold;
}

.acumulado{
    background:#dbeafe !important;
    font-weight:bold;
    color:#b91c1c;
}

.efetivo{
    background:#dcfce7 !important;
    font-weight:bold;
    color:#166534;
}
.periodoSemana{
    cursor:pointer;
    color:#2563eb;
    font-weight:bold;
    transition:.2s;
}

.periodoSemana:hover{
    text-decoration:underline;
}

#tbody tr.linhaSelecionada td{
    background:#fff4cc !important;
    transition:.2s;
}
.inicioLote{
    width:15px;
    height:15px;
    cursor:pointer;
}

#tbody tr.semanaInicial td{
    background:#fde68a !important;
    font-weight:bold;
}
@media print {

    thead{
        display:table-header-group;
    }

}
@media print {

    tr{
        page-break-inside: avoid;
    }

}
@media print {

    *{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

}
@media(max-width:900px){

    body{
        padding:10px;
    }

    .card{
        padding:15px;
    }

    .titulo{
        font-size:24px;
    }

    table{
        font-size:12px;
    }

    .mortalidade{
        width:50px;
    }

}
@media print {

    body{
        background:white;
        padding:0;
    }

    .card{
        box-shadow:none;
        border:1px solid #000;
        border-radius:0;
        margin-bottom:10px;
    }

    button,
    #listaLotes{
        display:none;
    }

    .titulo{
        font-size:22px;
        color:black;
    }

    table{
        font-size:10px;
        border:1px solid #000;
    }

    th{
        background:#d1d5db !important;
        color:black !important;
        border:1px solid #000;
    }

    td{
        border:1px solid #000;
    }

    input{
        border:none;
        background:transparent !important;
        text-align:center;
        font-weight:bold;
    }

    @page{
        size:landscape;
        margin:8mm;
    }

}
</style>
</head>
<body>

<div class="container">

<div class="card">

    <div class="titulo">
        MORTALIDADE SEMANAL
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;">

        <select id="listaLotes" style="max-width:300px;"></select>

        <button onclick="novoLote()">➕ Novo Lote</button>

        <button onclick="salvarLote()">💾 Salvar</button>

        <button onclick="excluirLote()">🗑 Excluir</button>

        <button class="btn-exportar" onclick="exportarBackup()">📤 Exportar Backup</button>

        <button class="btn-importar" onclick="document.getElementById('inputImportar').click()">📥 Importar Backup</button>

        <input type="file" id="inputImportar" accept="application/json" style="display:none">

    </div>

</div>

<div class="card">

<div class="top-grid">

<div>
<label class="info">PRODUTOR</label><br>
<input id="produtor" style="width:95%">
</div>

<div>
<label class="info">DATA NASCIMENTO</label><br>
<input type="date" id="nascimento">
</div>

<div>
<label class="info">Nº GALPÃO / LOTE</label><br>
<input id="galpao" style="width:95%">
</div>

<div>
<label class="info">Nº AVES INICIAL</label><br>
<input type="number" id="avesInicial">
</div>

<div>
<label class="info">GTA</label><br>
<input id="gta" style="width:95%">
</div>

<div>
<label class="info">IDADE</label><br>
<input id="idade" readonly style="width:95%">
</div>

<div>
<label class="info">FASE</label><br>
<input id="fase" readonly style="width:95%">
</div>

<div>
<button class="btn-detalhamento" onclick="abrirDetalhamento()">📊 Detalhamento</button>
</div>

</div>

</div>

<div class="card">

<table id="tabela">

<thead>
<tr>
<th>SEMANA</th>
<th>QUI</th>
<th>SEX</th>
<th>SAB</th>
<th>DOM</th>
<th>SEG</th>
<th>TER</th>
<th>QUA</th>
<th>PERÍODO</th>
<th>POR SEMANA</th>
<th>ACUM.</th>
<th>EFETIVO</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>

</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    getDocs,
    collection,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCm86UodpOlSZKR0qCjo37TiujgvnfeWOA",
  authDomain: "mortalidade-semanal.firebaseapp.com",
  projectId: "mortalidade-semanal",
  storageBucket: "mortalidade-semanal.firebasestorage.app",
  messagingSenderId: "104762865143",
  appId: "1:104762865143:web:a165dc839ba9d40de5eaf2",
  measurementId: "G-0N64K4SYZD"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let timerAutoSave = null;
let salvando = false;
let loteAtual = "";
let semanaInicial = 0;
let ajustesEfetivo = {};
let producaoOvos = {};
function gerarTabela(){

const tbody = document.getElementById("tbody");
tbody.innerHTML="";

for(let semana=1; semana<=200; semana++){

let tr=document.createElement("tr");

let html=`
<td>
<div style="display:flex;align-items:center;gap:6px;justify-content:center;">
<input
type="checkbox"
class="inicioLote"
onchange="selecionarSemanaInicial(this,${semana})">
<span>${semana}</span>
</div>
</td>
`;

for(let d=0; d<7; d++){

html+=`
<td>
<input
class="mortalidade"
type="number"
min="0"
value="0"
oninput="calcular(); autoSalvar();">
</td>`;
}
html+=`
<td class="periodoSemana">-</td>
`;
html+=`
<td class="semanaTotal">0</td>
<td class="acumulado">0</td>
<td>
<input
class="efetivo"
type="number"
value="0"
onchange="ajustarEfetivo(this)">
</td>
`;

tr.innerHTML=html;

tbody.appendChild(tr);

}

}

function calcular(){

    let avesInicial =
    Number(document.getElementById("avesInicial").value) || 0;

    let linhas =
    document.querySelectorAll("#tbody tr");

    let acumulado = 0;

    let efetivoAtual = avesInicial;

    linhas.forEach((linha, indice)=>{

        const numeroSemana = indice + 1;

        let inputs =
        linha.querySelectorAll(".mortalidade");

        let soma = 0;

        inputs.forEach(i=>{

            const valor = Number(i.value) || 0;

            soma += valor;

            if(valor > 0){
                i.style.background = "#fee2e2";
                i.style.color = "#b91c1c";
                i.style.fontWeight = "bold";
            }else{
                i.style.background = "#f8fafc";
                i.style.color = "#111";
                i.style.fontWeight = "normal";
            }

        });

        linha.querySelector(".semanaTotal").innerText = soma;

        // =============================
        // SEM SEMANA INICIAL MARCADA
        // =============================
        if(semanaInicial == 0){

            acumulado += soma;

            linha.querySelector(".acumulado").innerText = acumulado;

            if(ajustesEfetivo[numeroSemana] !== undefined){
                efetivoAtual = ajustesEfetivo[numeroSemana];
            }

            efetivoAtual -= soma;

            linha.querySelector(".efetivo").value = efetivoAtual;

            return;
        }

        // =============================
        // ANTES DA SEMANA INICIAL
        // =============================
        if(numeroSemana < semanaInicial){

            linha.querySelector(".acumulado").innerText = "-";
            linha.querySelector(".efetivo").value = "";

            return;
        }

        // =============================
        // SEMANA INICIAL
        // =============================
        if(numeroSemana == semanaInicial){

            acumulado = 0;

            linha.querySelector(".acumulado").innerText = 0;

            if(ajustesEfetivo[numeroSemana] !== undefined){

                efetivoAtual = ajustesEfetivo[numeroSemana];
                linha.querySelector(".efetivo").value = efetivoAtual;

            }else{

                linha.querySelector(".efetivo").value = "";

            }

            return;
        }

        // =============================
        // APÓS A SEMANA INICIAL
        // =============================

        acumulado += soma;

        linha.querySelector(".acumulado").innerText = acumulado;

        // Se houver ajuste manual nesta semana,
        // ele vira o efetivo inicial da semana.
        if(ajustesEfetivo[numeroSemana] !== undefined){
            efetivoAtual = ajustesEfetivo[numeroSemana];
        }

        // Agora desconta as mortes da semana.
        efetivoAtual -= soma;

        linha.querySelector(".efetivo").value = efetivoAtual;

    });

}
function ajustarEfetivo(input){

    const linha = input.closest("tr");
    const semana = [...document.querySelectorAll("#tbody tr")].indexOf(linha)+1;

    const valor = input.value.trim();
    
    if(valor === ""){
        delete ajustesEfetivo[semana];
    }else{
        ajustesEfetivo[semana] = Number(valor);
    }
    
    calcular();
    autoSalvar();

}
function selecionarSemanaInicial(check, semana){

    document
    .querySelectorAll(".inicioLote")
    .forEach(c=>{

        if(c!==check)
            c.checked=false;

    });

    document
    .querySelectorAll("#tbody tr")
    .forEach(tr=>tr.classList.remove("semanaInicial"));

    if(check.checked){

        semanaInicial=semana;

        check
        .closest("tr")
        .classList
        .add("semanaInicial");

    }else{

        semanaInicial=0;

    }

    calcular();
    autoSalvar();

}
function atualizarDatasSemanas() {

    const nascimento = document.getElementById("nascimento").value;

    if (!nascimento) return;

    // Evita problemas de fuso horário
    const [ano, mes, dia] = nascimento.split("-").map(Number);
    const dataBase = new Date(ano, mes - 1, dia);

    // Atualiza automaticamente os cabeçalhos da tabela
    const nomesDias = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
    const diaInicial = dataBase.getDay();

    const ths = document.querySelectorAll("#tabela thead th");

    // ths[0] = "SEMANA", então começamos no índice 1
    for (let i = 0; i < 7; i++) {
        ths[i + 1].textContent = nomesDias[(diaInicial + i) % 7];
    }

    const linhas = document.querySelectorAll("#tbody tr");

    linhas.forEach((linha, index) => {

        const inicio = new Date(dataBase);
        inicio.setDate(dataBase.getDate() + (index * 7));

        const fim = new Date(inicio);
        fim.setDate(inicio.getDate() + 6);

        const formatar = data =>
            data.toLocaleDateString("pt-BR");

        // Tooltip com os dias corretos
        let tooltip = "";

        for (let i = 0; i < 7; i++) {
            const data = new Date(inicio);
            data.setDate(inicio.getDate() + i);

            tooltip +=
                `${nomesDias[data.getDay()]}: ${formatar(data)}\n`;
        }

        const periodo = linha.querySelector(".periodoSemana");

        periodo.innerText =
            `${formatar(inicio)} até ${formatar(fim)}`;

        periodo.style.cursor = "pointer";


        periodo.onclick = () => {

            document.querySelectorAll("#tbody tr").forEach(tr => {
                tr.classList.remove("linhaSelecionada");
            });

            linha.classList.add("linhaSelecionada");

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    abrirModal(tooltip);
                });
            });

        };




    });
}



function atualizarIdade(){

let nasc =
document.getElementById("nascimento").value;

if(!nasc) return;

let hoje = new Date();

let dataNasc = new Date(nasc);

let dias =
Math.floor(
(hoje-dataNasc)/(1000*60*60*24)
);

let idade="";

if(dias<=105){

idade=dias+" dias";

}else{

idade=
Math.floor(dias/7)+
" semanas e "+
(dias%7)+" dias";

}

document.getElementById("idade").value=idade;

let fase="";

if(dias<=42){

fase="CRIA";

}else if(dias<=70){

fase="RECRIA";

}else if(dias<=105){

fase="MATURIDADE";

}else if(dias<=106){

fase="PRÉ-POSTURA";

}else if(dias<=273){

fase="POSTURA 1";

}else if(dias<=413){

fase="POSTURA 2";

}else if(dias<=553){

fase="POSTURA 3";

}else{

fase="POSTURA 4";

}

document.getElementById("fase").value=fase;

}

setInterval(atualizarIdade,1000);
function autoSalvar() {

    clearTimeout(timerAutoSave);

    timerAutoSave = setTimeout(() => {

        // Só salva se já existir um nome de lote
        if (document.getElementById("galpao").value.trim() !== "") {
            salvarLote(true);
        }

    }, 1000); 

}
async function salvarLote(auto = false) {

    if (salvando) return;

    salvando = true;
    clearTimeout(timerAutoSave);

    try {

        const nome = document
            .getElementById("galpao")
            .value
            .trim()
            .toUpperCase();
        // Se mudou o nome do lote, verifica se já existe
        if (nome !== loteAtual && nome !== "") {
        
            const existe = await getDoc(
                doc(db, "lotes", nome)
            );
        
            if (existe.exists()) {
        
                alert(
                    "Já existe um lote com esse nome.\n\n" +
                    "Escolha outro nome para não sobrescrever o existente."
                );
        
                return;
            }
        }
        if (!nome) {
            alert("Informe o Nº GALPÃO / LOTE.");
            document.getElementById("galpao").focus();
            return;
        }

        if (!document.getElementById("produtor").value.trim()) {
            alert("Informe o produtor.");
            return;
        }

        if (!document.getElementById("nascimento").value) {
            alert("Informe a data de nascimento.");
            return;
        }

        const dados = {
            produtor: document.getElementById("produtor").value.trim(),
            nascimento: document.getElementById("nascimento").value,
            galpao: nome,
            semanaInicial: semanaInicial,
            avesInicial: document.getElementById("avesInicial").value,
            gta: document.getElementById("gta").value.trim(),
            ajustesEfetivo: ajustesEfetivo,
            producaoOvos: producaoOvos,
            mortalidade: {}
        };

        let semanaNumero = 1;

        document.querySelectorAll("#tbody tr").forEach(linha => {

            const arr = [];

            linha.querySelectorAll(".mortalidade").forEach(inp=>{
                arr.push(Number(inp.value) || 0);
            });

            dados.mortalidade["semana_" + semanaNumero] = {
                qui: arr[0],
                sex: arr[1],
                sab: arr[2],
                dom: arr[3],
                seg: arr[4],
                ter: arr[5],
                qua: arr[6]
            };

            semanaNumero++;

        });

        await setDoc(doc(db, "lotes", nome), dados);
        
        // Se renomeou o lote, apaga o antigo
        if (
            loteAtual &&
            loteAtual !== nome
        ) {
            await deleteDoc(
                doc(db, "lotes", loteAtual)
            );
        }
        
        loteAtual = nome;

        if (!auto) {
            await carregarLista();
            document.getElementById("listaLotes").value = nome;
            await carregarLote(nome);
            alert("Salvo no Firestore!");
        }

    } catch (error) {

        console.error(error);
        alert("Erro ao salvar:\n\n" + error.message);

    } finally {

        // Garante que a trava seja liberada mesmo se houver return ou erro
        salvando = false;

    }
}

async function carregarLista(){

    let select =
    document.getElementById("listaLotes");

    select.innerHTML = "";

    // opção vazia
    let vazio = document.createElement("option");
    vazio.value = "";
    vazio.textContent = "-- Selecione um lote --";
    select.appendChild(vazio);

    const snapshot =
    await getDocs(
        collection(db,"lotes")
    );

    snapshot.forEach(docItem=>{

        let op =
        document.createElement("option");

        op.value =
        docItem.id;

        op.textContent =
        docItem.id;

        select.appendChild(op);

    });

    select.value = "";
}

async function carregarLote(nome){


    try{

        console.log("Carregando lote:", nome);

        const snap =
        await getDoc(
            doc(db,"lotes",nome)
        );

        if(!snap.exists()){

            alert("Lote não encontrado");
            return;

        }

        const d = snap.data();
        semanaInicial = d.semanaInicial ?? 0;
        ajustesEfetivo = d.ajustesEfetivo ?? {};
        producaoOvos = d.producaoOvos ?? {};
        loteAtual = nome;
        document.getElementById("produtor").value =
        d.produtor || "";

        document.getElementById("nascimento").value =
        d.nascimento || "";

        document.getElementById("galpao").value =
        d.galpao || "";

        document.getElementById("avesInicial").value =
        d.avesInicial || "";

        document.getElementById("gta").value =
        d.gta || "";

        // LIMPA TUDO ANTES
        document
        .querySelectorAll(".mortalidade")
        .forEach(inp=>inp.value=0);

        let linhas =
        document.querySelectorAll("#tbody tr");

        for(let i=1;i<=200;i++){

            const semana =
            d.mortalidade?.["semana_"+i];

            if(!semana) continue;

            const inputs =
            linhas[i-1].querySelectorAll(".mortalidade");

            inputs[0].value = semana.qui ?? 0;
            inputs[1].value = semana.sex ?? 0;
            inputs[2].value = semana.sab ?? 0;
            inputs[3].value = semana.dom ?? 0;
            inputs[4].value = semana.seg ?? 0;
            inputs[5].value = semana.ter ?? 0;
            inputs[6].value = semana.qua ?? 0;
        }
        // Marca o checkbox da semana inicial
        document
        .querySelectorAll(".inicioLote")
        .forEach((c,i)=>{
        
            c.checked = (i + 1) == semanaInicial;
        
        });
        
        // Deixa a linha destacada
        document
        .querySelectorAll("#tbody tr")
        .forEach((tr,i)=>{
        
            tr.classList.remove("semanaInicial");
        
            if((i + 1) == semanaInicial){
                tr.classList.add("semanaInicial");
            }
        
        });
        calcular();
        atualizarIdade();
        atualizarDatasSemanas();

    }catch(error){

        console.error(error);

        alert(
            "Erro ao carregar:\n\n" +
            error.message
        );
    }
}

// =============================
// EXPORTAR BACKUP
// =============================
async function exportarBackup() {

    try {

        const snapshot = await getDocs(collection(db, "lotes"));

        if (snapshot.empty) {
            alert("Não há lotes salvos para exportar.");
            return;
        }

        const backup = {};

        snapshot.forEach(docItem => {
            backup[docItem.id] = docItem.data();
        });

        const conteudo = JSON.stringify(backup, null, 2);

        const blob = new Blob([conteudo], { type: "application/json" });

        const url = URL.createObjectURL(blob);

        const dataHoje = new Date()
            .toISOString()
            .slice(0, 10);

        const a = document.createElement("a");
        a.href = url;
        a.download = `backup_mortalidade_${dataHoje}.json`;

        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    } catch (error) {

        console.error(error);
        alert("Erro ao exportar backup:\n\n" + error.message);

    }
}

// =============================
// IMPORTAR BACKUP
// =============================
async function importarBackup(event) {

    const arquivo = event.target.files[0];

    if (!arquivo) return;

    try {

        const texto = await arquivo.text();
        const dados = JSON.parse(texto);

        const nomes = Object.keys(dados);

        if (nomes.length === 0) {
            alert("Arquivo de backup vazio ou inválido.");
            return;
        }

        const confirmar = confirm(
            `Foram encontrados ${nomes.length} lote(s) no arquivo.\n\n` +
            `Lotes com o mesmo nome já existentes serão sobrescritos.\n\n` +
            `Deseja continuar com a importação?`
        );

        if (!confirmar) return;

        for (const nome of nomes) {
            await setDoc(doc(db, "lotes", nome), dados[nome]);
        }

        await carregarLista();

        alert("Backup importado com sucesso!");

    } catch (error) {

        console.error(error);
        alert("Erro ao importar backup:\n\n" + error.message);

    } finally {

        // Permite selecionar o mesmo arquivo novamente depois
        event.target.value = "";

    }
}

// =============================
// EFETIVO DE AVES EM UMA DATA ESPECÍFICA
// =============================
function parseDataLocal(dataISO){
    const [ano, mes, dia] = dataISO.split("-").map(Number);
    return new Date(ano, mes - 1, dia);
}

function obterEfetivoAtual(dataReferenciaISO){

    // Garante que a tabela está recalculada antes de ler os valores
    calcular();

    const nascimento = document.getElementById("nascimento").value;

    if(!nascimento) return null;

    const avesInicial =
    Number(document.getElementById("avesInicial").value) || 0;

    const dataBase = parseDataLocal(nascimento);
    dataBase.setHours(0,0,0,0);

    const dataReferencia =
        dataReferenciaISO ? parseDataLocal(dataReferenciaISO) : new Date();

    dataReferencia.setHours(0,0,0,0);

    const diffDias = Math.floor((dataReferencia - dataBase) / (1000*60*60*24));

    if(diffDias < 0) return avesInicial;

    const semanaAtual = Math.floor(diffDias / 7) + 1;
    const diaNaSemana = diffDias % 7;

    const linhas = document.querySelectorAll("#tbody tr");

    if(semanaAtual > linhas.length) return null;

    const linhaAtual = linhas[semanaAtual - 1];

    let efetivoInicio;

    if(semanaAtual === 1){

        efetivoInicio = avesInicial;

    }else{

        const linhaAnterior = linhas[semanaAtual - 2];
        const valorAnterior = linhaAnterior.querySelector(".efetivo").value;

        efetivoInicio =
        valorAnterior !== "" ? Number(valorAnterior) : avesInicial;

    }

    if(ajustesEfetivo[semanaAtual] !== undefined){
        efetivoInicio = ajustesEfetivo[semanaAtual];
    }

    const inputsMortalidade =
    linhaAtual.querySelectorAll(".mortalidade");

    let mortesAteData = 0;

    for(let i=0; i<=diaNaSemana; i++){
        mortesAteData += Number(inputsMortalidade[i].value) || 0;
    }

    return efetivoInicio - mortesAteData;

}

function formatarDataBR(dataISO){
    const [a,m,d] = dataISO.split("-");
    return `${d}/${m}/${a}`;
}

function obterDataLocalISO(data = new Date()){
    const ano = data.getFullYear();
    const mes = String(data.getMonth()+1).padStart(2,"0");
    const dia = String(data.getDate()).padStart(2,"0");
    return `${ano}-${mes}-${dia}`;
}

// =============================
// SALVAR REGISTRO DE OVOS DO DIA
// =============================
async function salvarRegistroOvos(){

    if(!loteAtual){
        alert("Selecione ou salve um lote primeiro.");
        return;
    }

    const data = document.getElementById("dataOvos").value;
    const ovos = Number(document.getElementById("ovosQtd").value);

    if(!data){
        alert("Informe a data.");
        return;
    }

    if(!ovos || ovos <= 0){
        alert("Informe a quantidade de ovos produzidos.");
        return;
    }

    const efetivo = obterEfetivoAtual(data);

    if(!efetivo || efetivo <= 0){
        alert("Não foi possível calcular o efetivo de aves para essa data. Verifique a data de nascimento e o nº de aves inicial.");
        return;
    }

    const percentual = (ovos / efetivo) * 100;

    const datasAnteriores =
        Object.keys(producaoOvos)
        .filter(d => d < data)
        .sort();

    const percentualAnterior =
        datasAnteriores.length
        ? producaoOvos[datasAnteriores[datasAnteriores.length - 1]].percentual
        : null;

    producaoOvos[data] = { ovos, efetivo, percentual };

    try{

        await setDoc(
            doc(db, "lotes", loteAtual),
            { producaoOvos },
            { merge:true }
        );

    }catch(error){

        console.error(error);
        alert("Erro ao salvar registro:\n\n" + error.message);
        return;

    }

    let aviso =
        `Registro salvo!\n\n` +
        `Ovos: ${ovos}\n` +
        `Aves efetivas: ${efetivo}\n` +
        `Percentual: ${percentual.toFixed(1)}%\n\n`;

    if(percentual < 80){
        aviso += "⚠️ ATENÇÃO: a produção está ABAIXO da meta mínima de 80%.\n";
    }else{
        aviso += "✅ Produção dentro da meta (≥80%).\n";
    }

    if(percentualAnterior !== null){

        const diferenca = percentual - percentualAnterior;

        if(diferenca > 0.05){
            aviso += `🔼 O percentual SUBIU ${diferenca.toFixed(1)} ponto(s) percentual(is) em relação ao último registro.`;
        }else if(diferenca < -0.05){
            aviso += `🔽 O percentual CAIU ${Math.abs(diferenca).toFixed(1)} ponto(s) percentual(is) em relação ao último registro.`;
        }else{
            aviso += "➡️ O percentual ficou estável em relação ao último registro.";
        }

    }

    alert(aviso);

    document.getElementById("ovosQtd").value = "";

    renderizarDetalhamento();

}

    document.getElementById("filtroDataInicio").value = "";

function renderizarGraficoOvos(){

    const inicio = document.getElementById("filtroDataInicio").value;
    const fim = document.getElementById("filtroDataFim").value;

    let datas = Object.keys(producaoOvos).sort();

    if(inicio){
        datas = datas.filter(d => d >= inicio);
    }

    if(fim){
        datas = datas.filter(d => d <= fim);
    }

    const labels = datas.map(d => formatarDataBR(d));
    const valores = datas.map(d => Number(producaoOvos[d].percentual.toFixed(1)));

    const elGrafico = document.getElementById("graficoOvos");
    const larguraDisponivel = elGrafico.clientWidth || 800;

    elGrafico.innerHTML =
        gerarGraficoSVG(labels, valores, larguraDisponivel);

}

// =============================
// HISTÓRICO AGRUPADO POR MÊS (RECOLHÍVEL)
// =============================
function renderizarHistoricoOvos(){

    const datasOrdenadas = Object.keys(producaoOvos).sort();

    const container = document.getElementById("containerHistorico");

    if(datasOrdenadas.length === 0){
        container.innerHTML =
            `<p style="text-align:center;color:#94a3b8;padding:20px;">Nenhum registro ainda</p>`;
        return;
    }

    // Calcula tendência em ordem cronológica (independente do agrupamento)
    const tendencias = {};
    let anterior = null;

    datasOrdenadas.forEach(data => {

        const reg = producaoOvos[data];
        let tendencia = "—";

        if(anterior !== null){
            if(reg.percentual > anterior + 0.05) tendencia = "🔼 Subiu";
            else if(reg.percentual < anterior - 0.05) tendencia = "🔽 Caiu";
            else tendencia = "➡️ Estável";
        }

        tendencias[data] = tendencia;
        anterior = reg.percentual;

    });

    // Agrupa por mês (YYYY-MM)
    const grupos = {};

    datasOrdenadas.forEach(data => {
        const chave = data.slice(0,7);
        if(!grupos[chave]) grupos[chave] = [];
        grupos[chave].push(data);
    });

    const chavesOrdenadas = Object.keys(grupos).sort().reverse();

    const nomesMeses = [
        "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
        "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
    ];

    let html = "";

    chavesOrdenadas.forEach((chave, indice) => {

        const [ano, mes] = chave.split("-").map(Number);
        const nomeMes = `${nomesMeses[mes-1]} de ${ano}`;

        const registrosMes = grupos[chave].slice().sort().reverse();

        const media =
            grupos[chave].reduce((soma,d)=>soma+producaoOvos[d].percentual,0) / grupos[chave].length;

        let linhasHtml = "";

        registrosMes.forEach(data => {

            const reg = producaoOvos[data];

            const statusClass = reg.percentual >= 80 ? "status-ok" : "status-baixo";
            const statusTexto = reg.percentual >= 80 ? "✅ Dentro da meta" : "⚠️ Abaixo da meta";

            linhasHtml += `
            <tr>
                <td>${formatarDataBR(data)}</td>
                <td>${reg.ovos}</td>
                <td>${reg.efetivo}</td>
                <td>${reg.percentual.toFixed(1)}%</td>
                <td class="${statusClass}">${statusTexto}</td>
                <td>${tendencias[data]}</td>
                <td><button onclick="excluirRegistroOvos('${data}')" style="background:#dc2626;padding:6px 10px;font-size:12px;margin:0;">🗑 Excluir</button></td>
            </tr>`;

        });

        html += `
        <details ${indice === 0 ? "open" : ""} style="margin-bottom:10px;border:1px solid #cbd5e1;border-radius:10px;overflow:hidden;">
            <summary style="cursor:pointer;background:#1e40af;color:#fff;padding:10px 14px;font-weight:bold;">
                📅 ${nomeMes} — ${grupos[chave].length} registro${grupos[chave].length > 1 ? "s" : ""} — média ${media.toFixed(1)}%
            </summary>
            <table class="tabela-ovos" style="margin-top:0;border:none;border-radius:0;">
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Ovos</th>
                    <th>Aves Efetivas</th>
                    <th>%</th>
                    <th>Situação</th>
                    <th>Tendência</th>
                    <th>Ação</th>
                </tr>
                </thead>
                <tbody>${linhasHtml}</tbody>
            </table>
        </details>`;

    });

    container.innerHTML = html;

}

// =============================
// GRÁFICO EM SVG PURO (SEM DEPENDÊNCIAS EXTERNAS)
// =============================
function gerarGraficoSVG(labels, valores, larguraDisponivel = 800){

    const margem = { top:24, right:30, bottom:60, left:50 };
    const larguraPorPonto = 70;
    const alturaGrafico = 260;

    // Largura mínima necessária para os pontos não ficarem colados
    const larguraMinimaPontos = Math.max(300, labels.length * larguraPorPonto);

    // Largura útil do container (descontando as margens do eixo)
    const larguraUtilContainer = Math.max(300, larguraDisponivel - margem.left - margem.right);

    // Usa a maior das duas: estica para preencher o card, ou abre scroll se tiver muitos pontos
    const larguraGrafico = Math.max(larguraMinimaPontos, larguraUtilContainer);

    const larguraTotal = larguraGrafico + margem.left + margem.right;
    const alturaTotal = alturaGrafico + margem.top + margem.bottom;

    const escalaY = v => margem.top + alturaGrafico - (Math.max(0, Math.min(v,100)) / 100) * alturaGrafico;

    const escalaX = i =>
        margem.left + (labels.length <= 1
            ? larguraGrafico / 2
            : i * (larguraGrafico / (labels.length - 1)));

    let svg = `<svg viewBox="0 0 ${larguraTotal} ${alturaTotal}" width="${larguraTotal}" height="${alturaTotal}" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial, sans-serif;">`;

    // grade + rótulos do eixo Y
    [0,20,40,60,80,100].forEach(v=>{

        const y = escalaY(v);

        svg += `<line x1="${margem.left}" y1="${y}" x2="${margem.left+larguraGrafico}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
        svg += `<text x="${margem.left-10}" y="${y+4}" font-size="11" fill="#64748b" text-anchor="end">${v}%</text>`;

    });

    // linha de meta (80%)
    const y80 = escalaY(80);

    svg += `<line x1="${margem.left}" y1="${y80}" x2="${margem.left+larguraGrafico}" y2="${y80}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6"/>`;
    svg += `<text x="${margem.left+larguraGrafico}" y="${y80-6}" font-size="11" fill="#b45309" text-anchor="end" font-weight="bold">Meta 80%</text>`;

    // eixo X
    svg += `<line x1="${margem.left}" y1="${margem.top+alturaGrafico}" x2="${margem.left+larguraGrafico}" y2="${margem.top+alturaGrafico}" stroke="#94a3b8" stroke-width="1.5"/>`;

    if(valores.length > 0){

        const pontos = valores.map((v,i)=> `${escalaX(i)},${escalaY(v)}`).join(" ");

        const areaPontos =
            `${escalaX(0)},${margem.top+alturaGrafico} ${pontos} ${escalaX(valores.length-1)},${margem.top+alturaGrafico}`;

        svg += `<polygon points="${areaPontos}" fill="rgba(37,99,235,.12)"/>`;
        svg += `<polyline points="${pontos}" fill="none" stroke="#2563eb" stroke-width="2.5"/>`;

        valores.forEach((v,i)=>{

            const cor = v >= 80 ? "#16a34a" : "#dc2626";

            svg += `<circle cx="${escalaX(i)}" cy="${escalaY(v)}" r="5" fill="${cor}" stroke="#fff" stroke-width="1.5"><title>${labels[i]}: ${v}%</title></circle>`;
            svg += `<text x="${escalaX(i)}" y="${escalaY(v)-12}" font-size="11" fill="${cor}" text-anchor="middle" font-weight="bold">${v}%</text>`;

        });

        labels.forEach((l,i)=>{

            svg += `<text x="${escalaX(i)}" y="${margem.top+alturaGrafico+18}" font-size="11" fill="#475569" text-anchor="middle" transform="rotate(-40 ${escalaX(i)} ${margem.top+alturaGrafico+18})">${l}</text>`;

        });

    }else{

        svg += `<text x="${larguraTotal/2}" y="${alturaTotal/2}" font-size="14" fill="#94a3b8" text-anchor="middle">Nenhum registro ainda</text>`;

    }

    svg += `</svg>`;

    return svg;

}

    <div class="subtitulo">Compare a produção diária de ovos com o número de aves efetivas da granja.</div>

        <span class="efetivo-box">🐔 Aves efetivas: <span id="efetivoAtualTexto">-</span></span>
    </div>

    <div class="form-ovos">

        <div>
            <label>DATA</label>
            <input type="date" id="dataOvos" onchange="atualizarEfetivoParaData()">
        </div>

        <div>
            <label>QTD. DE OVOS PRODUZIDOS</label>
            <input type="number" min="0" id="ovosQtd" placeholder="Ex: 1980">
        </div>

        <div>
            <button onclick="salvarRegistroOvos()" style="background:#16a34a;height:44px;">💾 Salvar Registro</button>
        </div>

    </div>

    <div class="form-ovos" style="background:#eef2ff;">

        <div>
            <label>FILTRAR GRÁFICO - DE</label>
            <input type="date" id="filtroDataInicio" onchange="renderizarGraficoOvos()">
        </div>

        <div>
            <label>FILTRAR GRÁFICO - ATÉ</label>
            <input type="date" id="filtroDataFim" onchange="renderizarGraficoOvos()">
        </div>

        <div>
            <button onclick="limparFiltroGrafico()" style="background:#64748b;height:44px;">✖ Limpar filtro</button>
        </div>

    </div>

    <div class="grafico-container">
        <div id="graficoOvos" style="width:100%;overflow-x:auto;"></div>
    </div>

    <div id="containerHistorico"></div>

    <button class="btn-fechar-modal" onclick="fecharDetalhamento()">Fechar</button>

</div>
</div>

<div id="modalDatas" style="
display:none;
position:fixed;
top:50%;
left:3%;
transform: translate(-40%, -50%);
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,.3);
z-index:9999;
white-space:pre-line;
">
    <div id="textoModal"></div>
    <br>
    <button onclick="fecharModal()">Fechar</button>
</div>
</body>
</html>
